# Feature engineering settings
features:
  # Price lag features (only selected important ones)
  price_lags: [1, 7, 30]

  # Moving averages (all important)
  ma_windows: [7, 21, 50]

  # RSI - DROP (low correlation)
  rsi_period: null

  # MACD - keep only signal line (highest correlation)
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  macd_include_histogram: false

  # Bollinger Bands - keep only position
  bb_window: 20
  bb_std: 2
  bb_include_bands: false

  # Rolling volatility - keep only 21d (higher correlation)
  volatility_windows: [21]

  # Calendar features (only important ones)
  include_calendar: true
  calendar_features: [quarter, month, week_of_year]


  # Returns - keep only 21d (highest correlation)
  return_periods: [21]


  # Other features
  include_close_to_ma: true
  close_to_ma_windows: [50]
  include_high_low_ratio: false

# Target variable
target:
  horizon: 7                # Predict 7 days ahead
  type: "close"             # "close" price or "return" or "direction"

# Train/test split
split:
  test_days: 60             # Last 60 days for testing
  gap: 0                    # No gap (continuous)