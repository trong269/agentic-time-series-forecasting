[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-time-series-forecasting"
version = "0.1.0"
description = "End-to-end automated pipeline for NVDA stock time series forecasting"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
